# Production-style stack: PostgreSQL + Redis + API + web UI.
# Copy .env.example to .env and fill in every REQUIRED value, then:  docker compose up -d --build
# Put a TLS-terminating reverse proxy (nginx, Caddy, a cloud load balancer) in front of ports 3000/8000.
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: contexta
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: contexta
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contexta -d contexta"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: ./backend
    environment:
      APP_ENV: production
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY (32+ random chars) in .env}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY (32+ random chars) in .env}
      DATABASE_URL: postgresql+asyncpg://contexta:${POSTGRES_PASSWORD}@postgres:5432/contexta
      REDIS_URL: redis://redis:6379/0
      ADMIN_EMAIL: ${ADMIN_EMAIL:?set ADMIN_EMAIL in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      NVD_API_KEY: ${NVD_API_KEY:-}
      INGEST_API_KEY: ${INGEST_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000"]}
      LOG_FORMAT: json
      # Set to true only when a reverse proxy you control sits in front and sets X-Forwarded-For
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
    volumes:
      - ledger_keys:/data
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        # Baked into the browser bundle: the URL users' browsers use to reach the API.
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000/api/v1}
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  ledger_keys:
